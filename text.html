<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>豆包RAG语音 Demo</title>
<style>
  :root {
    --bg:#0d0f14; --panel:#13161e; --border:#1f2433;
    --accent:#4fffb0; --accent2:#00b8ff; --warn:#ffb84f;
    --text:#e2e8f0; --muted:#5a6480; --code-bg:#080a10;
    --mono:'JetBrains Mono',monospace;
    --sans:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;display:flex;flex-direction:column}

  /* ── 顶栏 ── */
  header{padding:11px 16px;background:rgba(19,22,30,.98);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10}
  .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex-shrink:0}
  header h1{font-family:var(--mono);font-size:13px;font-weight:600}
  .conn-badge{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--border);padding:2px 9px;border-radius:20px;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .conn-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
  .conn-dot.on{background:var(--accent);box-shadow:0 0 6px var(--accent)}

  /* ── Tab 栏 ── */
  .tabs{display:flex;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
  .tab{flex:1;padding:10px 4px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;letter-spacing:.02em}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}

  /* ── 内容区 ── */
  .tab-content{display:none;flex:1;overflow-y:auto;flex-direction:column;min-height:0}
  .tab-content.active{display:flex}

  /* ── Tab0: 语音对话 ── */
  /* 流程条 */
  .flow-strip{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;background:rgba(19,22,30,.6)}
  .flow-node{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:10px;color:var(--muted);transition:all .3s;white-space:nowrap}
  .flow-node.lit{border-color:var(--accent);color:var(--accent);box-shadow:0 0 10px rgba(79,255,176,.2)}
  .flow-arrow{font-size:10px;color:var(--border);transition:color .3s}
  .flow-arrow.lit{color:var(--accent)}

  /* 字幕区 */
  .subtitle-box{margin:12px 14px 0;padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:14px;font-size:13px;line-height:1.7;min-height:52px;color:var(--muted);font-style:italic;word-break:break-all;transition:all .3s;flex-shrink:0}
  .subtitle-box.active{color:var(--text);font-style:normal;border-color:rgba(79,255,176,.25);background:rgba(79,255,176,.04)}

  /* 波形 */
  .wave-row{display:flex;align-items:center;justify-content:center;gap:5px;height:44px;flex-shrink:0}
  .dw-bar{width:4px;height:26px;border-radius:3px;transform-origin:bottom;background:linear-gradient(to top,#5b4fff,#9b59f5);transform:scaleY(.2);opacity:.4;transition:background .3s}
  .dw-bar.active{animation:dw-wave 1.1s ease-in-out infinite}
  .dw-bar.active:nth-child(1){animation-delay:0s}.dw-bar.active:nth-child(2){animation-delay:.14s}.dw-bar.active:nth-child(3){animation-delay:.28s}.dw-bar.active:nth-child(4){animation-delay:.42s}.dw-bar.active:nth-child(5){animation-delay:.56s}.dw-bar.active:nth-child(6){animation-delay:.70s}.dw-bar.active:nth-child(7){animation-delay:.84s}
  .dw-bar.green{background:linear-gradient(to top,#00c48c,#00e6a8)!important}
  @keyframes dw-wave{0%,100%{transform:scaleY(.2);opacity:.4}50%{transform:scaleY(1);opacity:1}}

  /* 状态文字 */
  .status-row{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 8px;font-family:var(--mono);flex-shrink:0}

  /* 麦克风悬浮按钮 */
  .mic-btn{
    position:fixed;bottom:28px;right:24px;z-index:100;
    width:62px;height:62px;border-radius:50%;border:none;
    background:linear-gradient(135deg,#5b4fff,#9b59f5);
    color:#fff;font-size:24px;cursor:pointer;
    display:none;align-items:center;justify-content:center;
    box-shadow:0 6px 24px rgba(91,79,255,.55),0 0 0 0 rgba(91,79,255,.4);
    transition:transform .15s,box-shadow .15s;
    flex-shrink:0;
  }
  .mic-btn.show{display:flex}
  .mic-btn:active{transform:scale(.92)}
  .mic-btn.listening{
    animation:mic-pulse 1.6s ease-in-out infinite;
    background:linear-gradient(135deg,#00c48c,#00e6a8);
    box-shadow:0 6px 24px rgba(0,196,140,.55),0 0 0 0 rgba(0,196,140,.4);
  }
  @keyframes mic-pulse{
    0%,100%{box-shadow:0 6px 24px rgba(0,196,140,.55),0 0 0 0 rgba(0,196,140,.4)}
    50%{box-shadow:0 6px 32px rgba(0,196,140,.7),0 0 0 12px rgba(0,196,140,.0)}
  }

  /* RAG 状态卡 */
  .rag-card{margin:10px 14px 0;padding:10px 12px;border-radius:12px;background:rgba(79,255,176,.06);border:1px solid rgba(79,255,176,.2);font-family:var(--mono);font-size:11px;color:var(--accent);display:none;flex-shrink:0}
  .rag-card.show{display:block}

  /* 文本输入区 */
  .text-input-area{margin:10px 14px 0;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--border);display:none;flex-shrink:0}
  .text-input-area.show{display:block}
  .text-input-area label{font-size:11px;color:var(--muted);font-family:var(--mono);display:block;margin-bottom:6px}
  .text-input-row{display:flex;gap:8px;align-items:flex-end}
  #textInput{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 11px;color:var(--text);font-family:var(--sans);font-size:13px;resize:none;outline:none;line-height:1.5;min-height:38px;max-height:80px;transition:border-color .2s}
  #textInput:focus{border-color:rgba(79,255,176,.4)}
  #textInput::placeholder{color:var(--muted)}
  .send-btn{width:38px;height:38px;border-radius:10px;border:none;background:var(--accent);color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
  .send-btn:active{transform:scale(.9)}

  /* 快捷chip */
  .hints{padding:8px 14px 10px;display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
  .hint-chip{font-size:11px;padding:5px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--border);color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .2s}
  .hint-chip:active{border-color:var(--accent);color:var(--accent)}

  /* ── Tab1: 知识库 ── */
  .kb-list{padding:14px;display:flex;flex-direction:column;gap:10px}
  .kb-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;position:relative;transition:all .3s}
  .kb-item.matched{border-color:var(--accent);box-shadow:0 0 16px rgba(79,255,176,.12)}
  .kb-item.matched::after{content:'✓ 已检索';position:absolute;top:10px;right:12px;font-family:var(--mono);font-size:10px;color:var(--accent)}
  .kb-name{font-weight:700;color:var(--accent2);font-size:14px;margin-bottom:3px}
  .kb-date{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:10px}
  .kb-row{margin-bottom:7px}
  .kb-section{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .kb-content{font-size:13px;color:var(--text);line-height:1.6}

  /* ── Tab2: RAG详情 ── */
  .detail-body{padding:14px;display:flex;flex-direction:column;gap:14px}
  .detail-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .detail-label::after{content:'';flex:1;height:1px;background:var(--border)}
  .detail-value{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12px;color:var(--text);line-height:1.7;word-break:break-all}
  .code-block{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:var(--mono);font-size:11px;line-height:1.7;overflow-x:auto;white-space:pre;color:#8fa3bf}
  .code-block .k{color:#c792ea}.code-block .s{color:#c3e88d}.code-block .n{color:var(--accent2)}.code-block .v{color:var(--warn)}

  .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-family:var(--mono);font-size:12px;line-height:2.2;text-align:center;padding:40px 20px}
  .empty-icon{font-size:36px;margin-bottom:12px;opacity:.5}

  ::-webkit-scrollbar{width:3px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>豆包实时语音 × RAG</h1>
  <div class="conn-badge">

<div class="tabs">

        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"

</div>

<!-- Tab1: 知识库 -->
<div class="tab-content" id="tab1">
  <div class="kb-list" id="kbList"></div>
</div>

<!-- Tab2: RAG详情 -->
<div class="tab-content" id="tab2">
  <div id="detailPane" style="flex:1;display:flex;flex-direction:column">
    <div class="empty-state">
      <div class="empty-icon">📡</div>
      触发一次 RAG 查询<br>这里会显示发给豆包<br>的完整 Payload
    </div>
  </div>
</div>

<!-- Tab3: 事件日志 -->
<div class="tab-content" id="tab3">

    <span style="font-family:var(--mono);font-size:10px;color:var(--muted)">实时事件流（最新在上）</span>
    <button onclick="evtLog=[];$('evtLog').textContent=''" style="font-family:var(--mono);font-size:10px;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer">清空</button>

<script>
// ══ 配置（和你原始文件一致）══════════════════════════════
const WS_URL      = 'wss://doubao-ws-proxy.onrender.com/proxy';
const SYSTEM_PROMPT = '你是一个亲切的智能助理，请简短口语化地回答，每次不超过3句话。';

  { name:'李四', date:'2026-05-26', items:[
    { section:'做了什么', content:'修复了线上bug，优化了查询性能，写了两篇文档' },
    { section:'遇到的问题', content:'数据库慢查询，已加索引解决' },

// ══ 状态 ═════════════════════════════════════════════════
let ws, sid, seq=2, state='idle';
let micStream, audioCtx, srcNode, processor;
let chunks=[], queue=[], playing=false;

// ══ DOM ══════════════════════════════════════════════════
const $= id=>document.getElementById(id);

// Tab 切换
const tabEls = document.querySelectorAll('.tab');
const contentEls = document.querySelectorAll('.tab-content');
function switchTab(i){ tabEls.forEach((t,j)=>t.classList.toggle('active',i===j)); contentEls.forEach((c,j)=>c.classList.toggle('active',i===j)); }

// 流程高亮
const fnIds=['fn-user','fn-match','fn-search','fn-rag','fn-reply'];
const faIds=['fa1','fa2','fa3','fa4'];
function litFlow(step){ fnIds.forEach((id,i)=>$(id).classList.toggle('lit',i<=step)); faIds.forEach((id,i)=>$(id).classList.toggle('lit',i<step)); }
function resetFlow(){ litFlow(-1); }

// 状态显示
function setStatus(t){ $('statusTxt').textContent=t; }
function setConnStatus(on,t){ $('connDot').classList.toggle('on',on); $('connStatus').textContent=t; }
function setSub(t,active){
  const el=$('subtitle');
  el.textContent=t||'等待对话开始…';
  el.classList.toggle('active',!!t&&active!==false);
}
function setWave(on,green){
  document.querySelectorAll('.dw-bar').forEach(b=>{ b.classList.toggle('active',on); b.classList.toggle('green',!!green); });
}
function showRagCard(t){ const c=$('ragCard'); if(t){c.textContent='⚡ '+t;c.classList.add('show');}else{c.classList.remove('show');} }

// ══ 知识库渲染 ════════════════════════════════════════════
function renderKB(matchedKey){
  const list=$('kbList'); list.innerHTML='';
  KB_GROUPS.forEach(rec=>{
    const key=rec.name+rec.date;
    const div=document.createElement('div');
    div.className='kb-item'+(matchedKey===key?' matched':'');

renderKB(null);

// ══ RAG详情渲染（500版本）════════════════════════════════
function renderDetail500(query,rec,text){
  $('detailPane').innerHTML=`
    <div class="detail-body">
      <div><div class="detail-label">请求事件</div>

<span class="k">}</span></div></div>

        </div></div>
    </div>`;
}

// ══ 二进制协议（原样复用）════════════════════════════════
const uuid=()=>'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16);});

const encode=(eid,payload,sessionId)=>{
  const hdr=new Uint8Array([0x11,0x14,0x10,0x00]);
  const parts=[];
  const eb=new ArrayBuffer(4);new DataView(eb).setUint32(0,eid,false);parts.push(new Uint8Array(eb));
  if(sessionId){const sb=new TextEncoder().encode(sessionId);const sl=new ArrayBuffer(4);new DataView(sl).setUint32(0,sb.byteLength,false);parts.push(new Uint8Array(sl));parts.push(sb);}
  const pb=typeof payload==='string'?new TextEncoder().encode(payload):new Uint8Array(payload);
  const pl=new ArrayBuffer(4);new DataView(pl).setUint32(0,pb.byteLength,false);
  parts.push(new Uint8Array(pl));parts.push(pb);
  const tot=parts.reduce((s,p)=>s+p.byteLength,hdr.byteLength);
  const out=new Uint8Array(tot);let o=0;out.set(hdr,o);o+=hdr.byteLength;
  parts.forEach(p=>{out.set(p,o);o+=p.byteLength;});return out.buffer;
};

const encodeAudio=pcm=>{
  const hdr=new Uint8Array([0x11,0x25,0x00,0x00]);seq++;
  const sq=new ArrayBuffer(4);new DataView(sq).setInt32(0,seq,false);
  const ev=new ArrayBuffer(4);new DataView(ev).setUint32(0,200,false);
  const sb=sid?new TextEncoder().encode(sid):new Uint8Array(0);
  const sl=new ArrayBuffer(4);new DataView(sl).setUint32(0,sb.byteLength,false);
  const pb=new Uint8Array(pcm);
  const pl=new ArrayBuffer(4);new DataView(pl).setUint32(0,pb.byteLength,false);
  const tot=4+4+4+4+sb.byteLength+4+pb.byteLength;
  const out=new Uint8Array(tot);let o=0;
  [hdr,new Uint8Array(sq),new Uint8Array(ev),new Uint8Array(sl),sb,new Uint8Array(pl),pb].forEach(p=>{out.set(p,o);o+=p.byteLength;});
  return out.buffer;
};

const parseFrame=buf=>{
  const dv=new DataView(buf);
  const hSz=(dv.getUint8(0)&0x0f)*4,msgType=(dv.getUint8(1)>>4)&0x0f,flags=dv.getUint8(1)&0x0f;
  let o=hSz;
  if(msgType===15)o+=4;
  if(flags&0x03)o+=4;
  let eid=0;if(flags&0x04){eid=dv.getUint32(o,false);o+=4;}
  if(o+4<=buf.byteLength){const sl=dv.getUint32(o,false);if(sl>0&&sl<200&&o+4+sl<=buf.byteLength){o+=4+sl;}}
  let payload=null;
  if(o+4<=buf.byteLength){const pl=dv.getUint32(o,false);o+=4;if(pl>0&&o+pl<=buf.byteLength)payload=buf.slice(o,o+pl);}
  return{msgType,eid,payload};
};

// ══ 音频队列 ═════════════════════════════════════════════
const flushAudio=()=>{
  if(!chunks.length)return;
  const tot=chunks.reduce((s,c)=>s+c.byteLength,0),merged=new Uint8Array(tot);let o=0;
  chunks.forEach(c=>{merged.set(new Uint8Array(c),o);o+=c.byteLength;});chunks=[];
  queue.push(URL.createObjectURL(new Blob([merged],{type:'audio/ogg; codecs=opus'})));
  playNext();
};
const playNext=()=>{
  if(playing||!queue.length)return;playing=true;
  const url=queue.shift(),a=new Audio(url);
  const done=()=>{URL.revokeObjectURL(url);playing=false;playNext();};
  a.onended=done;a.onerror=done;a.play().catch(done);
};
const stopAudio=()=>{queue=[];chunks=[];playing=false;};

// ══ 意图匹配 + RAG 检索（同步）═══════════════════════════
const sanitize=s=>s.replace(/[\r\n\t]/g,' ').replace(/\\/g,'、').replace(/["]/g,'').replace(/\s{2,}/g,' ').trim().substring(0,500);

let pendingRAG = null; // 语音路径：等 459 再发

function matchQuery(text){
  const m=text.match(/(?:查|帮我查|帮忙查|查一下|查询)(.{1,4}?)(今天|昨天)(的|的工作|遇到什么|做了什么|工作|情况|计划)?/);
  if(!m)return null;
  const name=m[1].replace(/的|工作|情况|报告|日报/g,'').trim();
  return{name,date:m[2]==='昨天'?'2026-05-25':'2026-05-26'};
}

// 同步检索 KB，返回 ragPayload 或 null
function lookupRAG(input){
  const query=matchQuery(input);
  if(!query)return null;
  const rec=KB_GROUPS.find(r=>r.name===query.name&&r.date===query.date);
  if(!rec)return null;
  const content=rec.items.map(it=>it.section+'：'+it.content).join('。');
  const ttsContent=rec.name+'，'+rec.date+'的工作日报。'+content+'。';
  return{query,rec,text:ttsContent};
}

// 更新UI（不影响发送时机）
function applyRAGUI(result){
  const{query,rec}=result;
  stopAudio();
  litFlow(1);
  showRagCard('意图识别：查 '+query.name+' · '+query.date);
  setStatus('检索知识库…');
  setTimeout(()=>{
    litFlow(2);
    renderKB(rec.name+rec.date);
    setTimeout(()=>{
      litFlow(3);
      showRagCard('知识库已就绪，等待发送…');
      renderDetail500(query,rec,result.text);
    },200);
  },200);
}

function flushPendingRAG(){
  if(!pendingRAG)return;
  const ragText=pendingRAG;
  pendingRAG=null;
  if(ws&&ws.readyState===WebSocket.OPEN){
    sendChatTTS(ragText,'(收到459后发送)');
  }
}

// 用 ChatTTSText(500) 流式发送文本
function sendChatTTS(ttsText, note=''){
  logEvt('→客户端',500,'ChatTTSText '+note+' 开始: '+ttsText.substring(0,30)+'…');
  ws.send(encode(500,JSON.stringify({start:true,content:ttsText,end:false}),sid));
  ws.send(encode(500,JSON.stringify({start:false,content:'',end:true}),sid));
  showRagCard('✅ TTS已发送(500)！切换「RAG详情」tab查看');
  setStatus('TTS已发送，等待播报…');
}

// ══ 事件日志（调试用）════════════════════════════════════
const EID_NAMES={50:'ConnectionStarted',150:'SessionStarted',153:'SessionFailed',
  350:'TTSSentenceStart',351:'TTSSentenceEnd',352:'TTSResponse',359:'TTSEnded',
  450:'ASRInfo',451:'ASRResponse',459:'ASREnded',500:'ChatTTSText',
  550:'ChatResponse',553:'ChatTextQueryConfirmed',559:'ChatEnded',599:'Error'};
let evtLog=[];
function logEvt(dir,eid,note=''){
  const name=EID_NAMES[eid]||'eid='+eid;
  const ts=new Date().toISOString().slice(11,23);
  const entry=`${ts} ${dir} [${eid}] ${name}${note?' '+note:''}`;
  evtLog.push(entry);
  if(evtLog.length>60)evtLog.shift();
  const el=$('evtLog');
  if(el){el.textContent=evtLog.slice().reverse().join('\n');}
  console.log(entry);
}

// ══ WS 消息处理 ════════════════════════════════════════════
const onMsg=evt=>{
  if(!(evt.data instanceof ArrayBuffer))return;
  const{msgType,eid,payload}=parseFrame(evt.data);
  // 记录所有服务端事件（msgType===9 是 JSON 事件，11 是音频帧）
  if(msgType===9){logEvt('←服务端',eid);}
  else if(msgType===11){logEvt('←音频帧',352,'(TTSResponse binary)');}
  if(msgType===9&&payload){
    let j={};try{j=JSON.parse(new TextDecoder().decode(payload));}catch(_){}
    if(eid===50){
      setConnStatus(true,'连接成功');
      setStatus('初始化会话…');
      const sessionPayload={
        tts:{speaker:SPEAKER,audio_config:{channel:1,format:'ogg_opus',sample_rate:24000},extra:{}},
        asr:{audio_info:{format:'pcm',sample_rate:16000,channel:1}},
        dialog:{bot_name:'助理',system_role:sanitize(SYSTEM_PROMPT),speaking_style:'口语化、简短，每次不超过3句话',extra:{model:'1.2.1.1',input_mod:'keep_alive',strict_audit:false}}
      };
      logEvt('→客户端',100,'StartSession');
      ws.send(encode(100,JSON.stringify(sessionPayload),sid));
    } else if(eid===150){
      state='listening';setStatus('连接就绪，可以说话了');
      $('micBtn').classList.add('show');
      $('micBtn').style.display='';
      litFlow(0);
    } else if(eid===350){
      const t=j.text||'';if(t)setSub(t,true);
      state='speaking';setStatus('助理正在说话…');
      setWave(true,false);litFlow(4);
    } else if(eid===351){flushAudio();
    } else if(eid===359){
      flushAudio();
      state='listening';
      setStatus('播报完毕，可以继续说话或输入…');
      setWave(false,false);
      resetFlow();
      // 恢复麦克风按钮，准备下一轮
      $('micBtn').classList.add('show');
      $('micBtn').style.display='';
      $('micBtn').style.opacity='1';
      litFlow(0);
    } else if(eid===450){stopAudio();setSub('',false);
    } else if(eid===451){
      const t=(j.results||[]).map(r=>r.text).join('');
      if(t){
        setSub(t,true);setStatus('识别到：'+t);litFlow(0);
        const result=lookupRAG(t);
        if(result){ applyRAGUI(result); pendingRAG=result.text; }
      }
    } else if(eid===459){
      flushPendingRAG();
    } else if(eid===553){
      // ChatTextQueryConfirmed ack，500模式下无需处理
    } else if(eid===153||eid===599){
      const errMsg=j.error||JSON.stringify(j);
      logEvt('←错误',eid,errMsg);
      setStatus('连接出错：'+errMsg);setConnStatus(false,'出错');
    }
  }
  if(msgType===11&&payload)chunks.push(payload);
};

// ══ 麦克风 ════════════════════════════════════════════════
function startMic(){
  if(state!=='listening')return;
  $('micBtn').style.opacity='.5';
  setStatus('正在打开麦克风…');
  navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(stream=>{
    micStream=stream;
    audioCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
    srcNode=audioCtx.createMediaStreamSource(stream);
    processor=audioCtx.createScriptProcessor(512,1,1);
    processor.onaudioprocess=e=>{
      if(!ws||ws.readyState!==WebSocket.OPEN)return;
      if(state==='speaking')return;
      const f32=e.inputBuffer.getChannelData(0),i16=new Int16Array(f32.length);
      f32.forEach((v,i)=>{i16[i]=Math.max(-32768,Math.min(32767,v*32767));});
      ws.send(encodeAudio(i16.buffer));
    };
    srcNode.connect(processor);processor.connect(audioCtx.destination);
    setStatus('正在聆听，请说话…');
    setWave(true,true);
    $('micBtn').classList.remove('show');
    $('micBtn').style.display='none';
  }).catch(e=>{setStatus('麦克风错误: '+(e.name||e.message));$('micBtn').style.opacity='1';});
}

function stopMic(){
  try{processor?.disconnect();}catch(_){}
  try{srcNode?.disconnect();}catch(_){}
  try{audioCtx?.close();}catch(_){}
  micStream?.getTracks().forEach(t=>t.stop());
  micStream=srcNode=processor=audioCtx=null;
}

// ══ 文字输入 ════════════════════════════════════════════
function fillText(t){ $('textInput').value=t; $('textInput').focus(); }

let pendingRAGAfter553 = null; // 收到 553 后立刻发的 RAG

function sendText(){
  const el=$('textInput');
  const text=el.value.trim();
  if(!text||!ws||ws.readyState!==WebSocket.OPEN){
    if(!ws||ws.readyState!==WebSocket.OPEN){ setStatus('未连接，请等待…'); return; }
    return;
  }
  el.value='';el.style.height='auto';
  setSub(text,true);setStatus('发送中…');
  resetFlow();litFlow(0);

  const result=lookupRAG(text);
  if(result){
    applyRAGUI(result);
    pendingRAGAfter553 = null;
    sendChatTTS(result.text,'(文字直发)');
    litFlow(3);
  } else {
    logEvt('→客户端',501,'ChatTextQuery: '+text);
    ws.send(encode(501,JSON.stringify({content:text}),sid));
    setStatus('等待回复…');
  }
}

// ══ 初始化连接 ════════════════════════════════════════════
function initWS(){
  setConnStatus(false,'连接中…');setStatus('正在连接服务器…');
  sid=uuid();seq=2;chunks=[];

  const u=new URL(WS_URL);
  u.searchParams.set('session_id','dw_'+Date.now());
  ws=new WebSocket(u.toString());ws.binaryType='arraybuffer';
  ws.onopen=()=>{
    ws.send(encode(1,'{}',null));
    // 连接后立即显示麦克风按钮，让用户知道可以等待
    $('micBtn').classList.add('show');
  };
  ws.onmessage=onMsg;
  ws.onerror=()=>{setConnStatus(false,'连接失败');setStatus('连接失败，请刷新重试');};
  ws.onclose=e=>{stopMic();setConnStatus(false,'已断开');setStatus('已断开('+e.code+')，刷新重连');state='idle';setWave(false,false);$('micBtn').classList.remove('show');$('micBtn').style.display='';};
}

initWS();
</script>
