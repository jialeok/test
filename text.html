<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆包实时语音 × RAG 接入 Demo</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0d0f14;
    --panel:    #13161e;
    --border:   #1f2433;
    --accent:   #4fffb0;
    --accent2:  #00b8ff;
    --warn:     #ffb84f;
    --text:     #e2e8f0;
    --muted:    #5a6480;
    --code-bg:  #080a10;
    --radius:   12px;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    overflow-x: hidden;
  }

  /* ── 顶部标题栏 ── */
  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(19,22,30,.95);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    flex-shrink: 0;
  }
  header h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: .03em;
  }
  header .tag {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 20px;
  }

  /* ── 主体三栏布局 ── */
  main {
    display: grid;
    grid-template-columns: 280px 1fr 300px;
    gap: 0;
    height: calc(100vh - 57px);
    overflow: hidden;
  }

  /* ── 通用面板 ── */
  .pane {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .pane:last-child { border-right: none; }
  .pane-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .pane-title {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .step-badge {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    flex-shrink: 0;
  }
  .step-badge.active {
    background: var(--accent);
    color: #000;
    box-shadow: 0 0 10px rgba(79,255,176,.4);
  }
  .pane-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  /* ── 左栏：知识库 ── */
  .kb-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
    position: relative;
  }
  .kb-item:hover {
    border-color: rgba(79,255,176,.3);
    box-shadow: 0 0 20px rgba(79,255,176,.06);
  }
  .kb-item.matched {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(79,255,176,.15);
  }
  .kb-item.matched::before {
    content: '已检索';
    position: absolute;
    top: 8px; right: 10px;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--accent);
    letter-spacing: .05em;
  }
  .kb-name {
    font-weight: 700;
    color: var(--accent2);
    font-size: 13px;
    margin-bottom: 4px;
  }
  .kb-date {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .kb-section {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .kb-content {
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
  }
  .kb-divider {
    height: 1px;
    background: var(--border);
    margin: 8px 0;
  }

  /* ── 中栏：流程可视化 ── */
  .center-pane {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 流程图 */
  .flow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .flow-node {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    transition: all .3s;
  }
  .flow-node.lit {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 14px rgba(79,255,176,.2);
  }
  .flow-arrow {
    font-size: 14px;
    color: var(--border);
    transition: color .3s;
  }
  .flow-arrow.lit { color: var(--accent); }

  /* 对话区 */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    display: flex;
    gap: 10px;
    animation: fadeup .3s ease;
  }
  @keyframes fadeup {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 15px;
    font-weight: 700;
  }
  .avatar.u { background: var(--accent2); color: #000; }
  .avatar.a { background: linear-gradient(135deg, #1a1f30, #252b3f); border: 1px solid var(--border); }
  .bubble {
    max-width: 75%;
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.65;
  }
  .msg.user .bubble {
    background: rgba(0,184,255,.15);
    border: 1px solid rgba(0,184,255,.25);
    color: var(--text);
  }
  .msg.ai .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .msg.system .bubble {
    background: rgba(79,255,176,.06);
    border: 1px solid rgba(79,255,176,.2);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
  }
  .msg.warn .bubble {
    background: rgba(255,184,79,.06);
    border: 1px solid rgba(255,184,79,.2);
    color: var(--warn);
    font-family: var(--mono);
    font-size: 12px;
  }

  /* 输入区 */
  .input-bar {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: rgba(13,15,20,.9);
    flex-shrink: 0;
  }
  #userInput {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    resize: none;
    outline: none;
    line-height: 1.5;
    min-height: 44px;
    max-height: 100px;
    transition: border-color .2s;
  }
  #userInput:focus { border-color: rgba(79,255,176,.4); }
  #userInput::placeholder { color: var(--muted); }
  .send-btn {
    width: 44px; height: 44px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #000;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 18px;
    transition: opacity .2s, transform .1s;
  }
  .send-btn:hover { opacity: .9; }
  .send-btn:active { transform: scale(.93); }
  .send-btn:disabled { opacity: .3; cursor: default; }

  /* 快捷问法提示 */
  .hints {
    padding: 0 18px 10px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .hint-chip {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .hint-chip:hover {
    border-color: rgba(79,255,176,.4);
    color: var(--accent);
  }

  /* ── 右栏：RAG 请求详情 ── */
  .code-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    overflow-x: auto;
    white-space: pre;
    color: #8fa3bf;
    margin-bottom: 12px;
    position: relative;
  }
  .code-block .k  { color: #c792ea; }
  .code-block .s  { color: #c3e88d; }
  .code-block .n  { color: var(--accent2); }
  .code-block .v  { color: var(--warn); }

  .detail-section {
    margin-bottom: 16px;
  }
  .detail-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .detail-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .detail-value {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    line-height: 1.6;
    word-break: break-all;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .status-dot.on {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: .3; }
  }
  .status-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 2;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>豆包实时语音 × RAG 接入 Demo</h1>
  <span class="tag">ChatRAGText · 事件 502</span>
</header>

<main>
  <!-- 左栏：知识库 -->
  <div class="pane">
    <div class="pane-header">
      <div class="step-badge" id="badge1">1</div>
      <span class="pane-title">知识库 / RAG 数据源</span>
    </div>
    <div class="pane-body" id="kbList"></div>
  </div>

  <!-- 中栏：对话 -->
  <div class="pane center-pane" style="border-right:1px solid var(--border)">
    <div class="pane-header">
      <div class="step-badge" id="badge2">2</div>
      <span class="pane-title">语音对话模拟</span>
    </div>

    <!-- 流程节点 -->
    <div class="flow">
      <div class="flow-node" id="fn-user">用户提问</div>
      <div class="flow-arrow" id="fa1">→</div>
      <div class="flow-node" id="fn-match">意图识别</div>
      <div class="flow-arrow" id="fa2">→</div>
      <div class="flow-node" id="fn-search">检索知识库</div>
      <div class="flow-arrow" id="fa3">→</div>
      <div class="flow-node" id="fn-rag">发送 RAG (502)</div>
      <div class="flow-arrow" id="fa4">→</div>
      <div class="flow-node" id="fn-reply">豆包播报</div>
    </div>

    <!-- 对话区 -->
    <div class="chat-area" id="chatArea">
      <div class="empty-state">
        👆 在下方输入问题，体验 RAG 接入全流程<br>
        例如：查小张今天的工作
      </div>
    </div>

    <!-- 快捷提问 -->
    <div class="hints">
      <div class="hint-chip" onclick="fillInput('查小张今天的工作')">查小张今天的工作</div>
      <div class="hint-chip" onclick="fillInput('小张昨天遇到什么问题')">小张昨天遇到什么问题</div>
      <div class="hint-chip" onclick="fillInput('查李四今天的工作')">查李四今天的工作</div>
      <div class="hint-chip" onclick="fillInput('天气怎么样')">天气怎么样（非RAG）</div>
    </div>

    <!-- 输入框 -->
    <div class="input-bar">
      <textarea id="userInput" placeholder="输入问题，回车发送…" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
      ></textarea>
      <button class="send-btn" onclick="sendMsg()" id="sendBtn">➤</button>
    </div>
  </div>

  <!-- 右栏：RAG 请求详情 -->
  <div class="pane" style="border-right:none">
    <div class="pane-header">
      <div class="step-badge" id="badge3">3</div>
      <span class="pane-title">RAG 请求详情</span>
    </div>
    <div class="pane-body" id="detailPane">
      <div class="empty-state">
        发起一次 RAG 查询<br>右侧会显示实际发送给<br>豆包的数据结构
      </div>
    </div>
  </div>
</main>

<script>
// ── 知识库数据（模拟你的业务数据库）──────────────────────
const KB = [
  { name:'小张', date:'2026-05-26', items:[
    { section:'做了什么', content:'完成了客户A的需求评审，写了接口文档，代码提交了两个模块' },
    { section:'遇到的问题', content:'后端接口文档缺失，已跟后端老李沟通确认，正在补文档' },
    { section:'明日计划',  content:'对接客户B联调测试，修复QA提的3个bug' },
  ]},
  { name:'小张', date:'2026-05-25', items:[
    { section:'做了什么', content:'参加了需求评审会议，搭建了测试环境' },
    { section:'遇到的问题', content:'服务器权限不足，已申请运维开通' },
    { section:'明日计划',  content:'完成接口开发，准备联调' },
  ]},
  { name:'李四', date:'2026-05-26', items:[
    { section:'做了什么', content:'修复了线上bug，优化了查询性能，写了两篇文档' },
    { section:'遇到的问题', content:'数据库慢查询，已加索引解决' },
    { section:'明日计划',  content:'压测新版本，准备上线' },
  ]},
];

// ── 渲染知识库 ─────────────────────────────────────────
function renderKB(matchedKey) {
  const list = document.getElementById('kbList');
  list.innerHTML = '';
  KB.forEach(rec => {
    const key = rec.name + rec.date;
    const div = document.createElement('div');
    div.className = 'kb-item' + (matchedKey === key ? ' matched' : '');
    div.id = 'kb_' + key;
    let html = `<div class="kb-name">${rec.name}</div>
                <div class="kb-date">${rec.date}</div>`;
    rec.items.forEach((it, i) => {
      if(i > 0) html += '<div class="kb-divider"></div>';
      html += `<div class="kb-section">${it.section}</div>
               <div class="kb-content">${it.content}</div>`;
    });
    div.innerHTML = html;
    list.appendChild(div);
  });
}
renderKB(null);

// ── 工具函数 ───────────────────────────────────────────
const chatArea = document.getElementById('chatArea');
let firstMsg = true;

function addMsg(role, text) {
  if(firstMsg) { chatArea.innerHTML = ''; firstMsg = false; }
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  let avatar = '';
  if(role === 'user') avatar = '<div class="avatar u">我</div>';
  else if(role === 'ai') avatar = '<div class="avatar a">🤖</div>';
  d.innerHTML = `${avatar}<div class="bubble">${text}</div>`;
  chatArea.appendChild(d);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addSystem(text) {
  const d = document.createElement('div');
  d.className = 'msg system';
  d.innerHTML = `<div class="bubble">⚡ ${text}</div>`;
  chatArea.appendChild(d);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addWarn(text) {
  const d = document.createElement('div');
  d.className = 'msg warn';
  d.innerHTML = `<div class="bubble">⚠ ${text}</div>`;
  chatArea.appendChild(d);
  chatArea.scrollTop = chatArea.scrollHeight;
}

// ── 流程节点高亮 ──────────────────────────────────────
const flowNodes = ['fn-user','fn-match','fn-search','fn-rag','fn-reply'];
const flowArrows = ['fa1','fa2','fa3','fa4'];

function litFlow(step) {
  // step: 0=用户 1=意图识别 2=检索 3=发送RAG 4=播报
  flowNodes.forEach((id,i) => {
    document.getElementById(id).classList.toggle('lit', i <= step);
  });
  flowArrows.forEach((id,i) => {
    document.getElementById(id).classList.toggle('lit', i < step);
  });
}
function resetFlow() { litFlow(-1); }

// ── 意图匹配 ──────────────────────────────────────────
function matchQuery(text) {
  // 支持：查/帮我查 + 名字 + 今天/昨天
  const m = text.match(/(?:查|帮我查|帮忙查|查一下|查询)(.{1,4}?)(今天|昨天)(的|的工作|遇到什么|做了什么|工作|情况|计划)?/);
  if(!m) return null;
  const name = m[1].replace(/的|工作|情况|报告|日报/g,'').trim();
  const dateMap = { '今天':'2026-05-26', '昨天':'2026-05-25' };
  return { name, date: dateMap[m[2]] || '2026-05-26' };
}

// ── 构造 RAG payload ──────────────────────────────────
function buildRAGPayload(rec) {
  const content = rec.items.map(it => `${it.section}：${it.content}`).join('；');
  const ragArr = [{ title: `${rec.name} ${rec.date} 工作日报`, content }];
  return {
    external_rag: JSON.stringify(ragArr)
  };
}

// ── 渲染右侧详情面板 ─────────────────────────────────
function renderDetail(query, rec, payload) {
  const pane = document.getElementById('detailPane');

  // 构建美化的 JSON
  const ragParsed = JSON.parse(payload.external_rag);
  const prettyInner = JSON.stringify(ragParsed, null, 2);
  const prettyOuter = JSON.stringify({ external_rag: '[见下方展开]' }, null, 2);

  pane.innerHTML = `
    <div class="detail-section">
      <div class="detail-label">请求事件</div>
      <div class="detail-value">
        事件ID: <span style="color:var(--accent)">502</span> &nbsp; ChatRAGText<br>
        协议: <span style="color:var(--accent2)">WebSocket 二进制帧</span>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-label">检索参数</div>
      <div class="detail-value">
        姓名: <span style="color:var(--warn)">${query.name}</span><br>
        日期: <span style="color:var(--warn)">${query.date}</span>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-label">发送给豆包的 Payload</div>
      <div class="code-block"><span class="k">{</span>
  <span class="n">"external_rag"</span><span class="k">:</span> <span class="s">JSON.stringify</span>(<span class="k">[</span>
    <span class="k">{</span>
      <span class="n">"title"</span><span class="k">:</span> <span class="s">"${ragParsed[0].title}"</span>,
      <span class="n">"content"</span><span class="k">:</span> <span class="s">"${ragParsed[0].content.substring(0,60)}..."</span>
    <span class="k">}</span>
  <span class="k">]</span>)
<span class="k">}</span></div>
    </div>

    <div class="detail-section">
      <div class="detail-label">content 完整内容</div>
      <div class="detail-value" style="font-size:12px;line-height:1.8">${ragParsed[0].content}</div>
    </div>

    <div class="detail-section">
      <div class="detail-label">豆包处理流程</div>
      <div class="detail-value" style="font-size:12px;line-height:2">
        <span style="color:var(--accent)">1.</span> 收到 external_rag 数据<br>
        <span style="color:var(--accent)">2.</span> 模型总结 + 口语化改写<br>
        <span style="color:var(--accent)">3.</span> TTS 转语音流式播报<br>
        <span style="color:var(--accent)">4.</span> 返回 TTSSentenceStart (350)<br>
        <span style="color:var(--accent)">5.</span> 流式返回 TTSResponse (352)
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-label">注意事项</div>
      <div class="detail-value" style="font-size:12px;line-height:2;color:var(--muted)">
        • external_rag 是 <span style="color:var(--warn)">JSON 数组字符串</span><br>
        • 总长度不超过 <span style="color:var(--warn)">4000 字符</span><br>
        • 需在 ASREnded (459) 之后发送<br>
        • 此时不触发模型自身闲聊回复
      </div>
    </div>
  `;
}

// ── 主发送逻辑 ────────────────────────────────────────
function fillInput(text) {
  document.getElementById('userInput').value = text;
  document.getElementById('userInput').focus();
}

async function sendMsg() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  input.style.height = 'auto';

  // 重置状态
  resetFlow();
  renderKB(null);

  // 1. 用户提问
  addMsg('user', text);
  litFlow(0);

  // 2. 意图识别
  await sleep(400);
  addSystem('ASR 识别完成 → 开始意图匹配…');
  litFlow(1);

  const query = matchQuery(text);
  if(!query) {
    await sleep(500);
    addSystem('未命中 RAG 意图 → 转普通闲聊模式');
    addMsg('ai', '这个问题我直接回答你～（普通模式，不走 RAG）');
    addWarn('非 RAG 场景：豆包直接使用模型自身知识回复，不发送 502 事件');
    resetFlow();
    document.getElementById('detailPane').innerHTML = `
      <div class="empty-state">未命中 RAG 意图<br>本次走普通闲聊模式<br>未触发 ChatRAGText (502)</div>
    `;
    return;
  }

  // 3. 检索知识库
  await sleep(500);
  addSystem(`意图识别：查询 <b>${query.name}</b> · ${query.date} 的工作记录`);
  litFlow(2);

  await sleep(600);
  const rec = KB.find(r => r.name === query.name && r.date === query.date);

  if(!rec) {
    addWarn(`知识库未找到 ${query.name} 在 ${query.date} 的记录`);
    addMsg('ai', `抱歉，没有找到${query.name}在${query.date}的工作记录。`);
    resetFlow();
    return;
  }

  // 高亮知识库条目
  renderKB(rec.name + rec.date);
  addSystem(`检索命中 ${rec.items.length} 条记录 → 构造 RAG payload`);

  // 4. 发送 RAG (502)
  await sleep(600);
  litFlow(3);
  const payload = buildRAGPayload(rec);
  addSystem('发送 ChatRAGText 事件 (502) → ws.send(encode(502, payload, sessionId))');

  // 渲染详情
  renderDetail(query, rec, payload);

  // 5. 豆包播报
  await sleep(800);
  litFlow(4);
  addSystem('收到 TTSSentenceStart (350) → 豆包开始播报');

  // 模拟豆包口语化改写后的回复
  const summary = generateSummary(rec, query);
  await sleep(300);
  addMsg('ai', summary);

  // badge 激活
  ['badge1','badge2','badge3'].forEach(id => {
    document.getElementById(id).classList.add('active');
  });
  setTimeout(() => {
    ['badge1','badge2','badge3'].forEach(id => {
      document.getElementById(id).classList.remove('active');
    });
  }, 3000);
}

function generateSummary(rec, query) {
  const todo = rec.items.find(i => i.section === '做了什么');
  const prob = rec.items.find(i => i.section === '遇到的问题');
  const plan = rec.items.find(i => i.section === '明日计划');
  let s = `${query.name}${query.date === '2026-05-26' ? '今天' : '昨天'}`;
  if(todo) s += `${todo.content}。`;
  if(prob) s += `遇到的问题是${prob.content}。`;
  if(plan) s += `明天计划${plan.content}。`;
  return s;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
