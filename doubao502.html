<!-- 3. 样式 & 图标 -->
<style>
@font-face {
  font-family:'Material Icons Round';
  font-display:block;

}
@keyframes dw-pulse {

}
@keyframes dw-slideup {
  from{transform:translateY(100%);opacity:.5}
  to  {transform:translateY(0);opacity:1}

@keyframes dw-wave {
  0%,100%{transform:scaleY(.2);opacity:.4}
  50%    {transform:scaleY(1);opacity:1}
}
.dw-bar {
  width:4px;height:28px;border-radius:3px;transform-origin:bottom;
  background:linear-gradient(to top,#5b4fff,#9b59f5);
  transform:scaleY(.2);opacity:.4;
  transition:background .3s;
}
.dw-bar.active { animation:dw-wave 1.1s ease-in-out infinite; }
.dw-bar.active:nth-child(1){animation-delay:0s}
.dw-bar.active:nth-child(2){animation-delay:.14s}
.dw-bar.active:nth-child(3){animation-delay:.28s}
.dw-bar.active:nth-child(4){animation-delay:.42s}
.dw-bar.active:nth-child(5){animation-delay:.56s}
.dw-bar.active:nth-child(6){animation-delay:.70s}
.dw-bar.active:nth-child(7){animation-delay:.84s}
.dw-bar.green { background:linear-gradient(to top,#00c48c,#00e6a8) !important; }
</style>

<!-- 4. 核心逻辑 -->
<script>
const DW = (() => {
  // ── 组件配置（按需修改这里）──────────────────────────
  const WS_URL       = 'wss://doubao-ws-proxy.onrender.com/proxy';
  const SYSTEM_PROMPT= window._doubaoSystemPrompt || '你是一个亲切的智能助理，请简短口语化地回答，每次不超过3句话。';
  const SPEAKER      = window._doubaoSpeaker      || 'zh_female_vv_jupiter_bigtts';
  const BOT_NAME     = '智能助理'; // 显示在 Modal 头部的名字
  // ────────────────────────────────────────────────────

  let ws, sid, seq=2, state='idle';
  let micStream, audioCtx, srcNode, processor;
  let chunks=[], queue=[], playing=false;

  // DOM 引用
  const $ = id => document.getElementById(id);

  const setStatus = t => { $('dw-status').textContent = t; };
  const setDot    = on => {
    const d = $('dw-dot');
    d.style.background = on ? '#00c48c' : '#d0d0da';
    d.style.animation  = on ? 'dw-dotpulse 1.2s ease-in-out infinite' : 'none';
  };
  const setSub = t => {
    const el = $('dw-sub');
    el.textContent = t || '';
    if (!t) el.innerHTML = '<span style="color:#9999aa;font-style:italic">等待对话开始…</span>';
    el.style.borderColor    = t ? 'transparent' : 'transparent';
  };
  const setWave = (active, green) => {
    document.querySelectorAll('.dw-bar').forEach(b => {
      b.classList.toggle('active', active);
      b.classList.toggle('green', !!green);
    });
  };
  const setListening = on => {
    setDot(on);
    setWave(on, on); // 聆听时绿色，说话时紫色由调用方决定
    $('dw-sub').style.borderColor = on ? 'rgba(0,196,140,.2)' : 'transparent';
    $('dw-sub').style.background  = on ? 'rgba(0,196,140,.04)' : '#f4f4f8';
  };

  // ── 二进制协议 ────────────────────────────────────────
  const uuid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });

  const encode = (eid, payload, sessionId) => {
    const hdr  = new Uint8Array([0x11,0x14,0x10,0x00]);
    const parts = [];
    const eb = new ArrayBuffer(4); new DataView(eb).setUint32(0,eid,false); parts.push(new Uint8Array(eb));
    if (sessionId) {
      const sb = new TextEncoder().encode(sessionId);
      const sl = new ArrayBuffer(4); new DataView(sl).setUint32(0,sb.byteLength,false);
      parts.push(new Uint8Array(sl)); parts.push(sb);
    }
    const pb = typeof payload==='string' ? new TextEncoder().encode(payload) : new Uint8Array(payload);
    const pl = new ArrayBuffer(4); new DataView(pl).setUint32(0,pb.byteLength,false);
    parts.push(new Uint8Array(pl)); parts.push(pb);
    const tot = parts.reduce((s,p)=>s+p.byteLength, hdr.byteLength);
    const out = new Uint8Array(tot); let o=0;
    out.set(hdr,o); o+=hdr.byteLength;
    parts.forEach(p=>{out.set(p,o);o+=p.byteLength;});
    return out.buffer;
  };

  const encodeAudio = pcm => {
    const hdr = new Uint8Array([0x11,0x25,0x00,0x00]);
    seq++;
    const sq=new ArrayBuffer(4); new DataView(sq).setInt32(0,seq,false);
    const ev=new ArrayBuffer(4); new DataView(ev).setUint32(0,200,false);
    const sb=sid?new TextEncoder().encode(sid):new Uint8Array(0);
    const sl=new ArrayBuffer(4); new DataView(sl).setUint32(0,sb.byteLength,false);
    const pb=new Uint8Array(pcm);
    const pl=new ArrayBuffer(4); new DataView(pl).setUint32(0,pb.byteLength,false);
    const tot=4+4+4+4+sb.byteLength+4+pb.byteLength;
    const out=new Uint8Array(tot); let o=0;
    [hdr,new Uint8Array(sq),new Uint8Array(ev),new Uint8Array(sl),sb,new Uint8Array(pl),pb]
      .forEach(p=>{out.set(p,o);o+=p.byteLength;});
    return out.buffer;
  };

  const parseFrame = buf => {
    const dv=new DataView(buf);
    const hSz=(dv.getUint8(0)&0x0f)*4, msgType=(dv.getUint8(1)>>4)&0x0f, flags=dv.getUint8(1)&0x0f;
    let o=hSz;
    if(msgType===15)o+=4;
    if(flags&0x03)o+=4;
    let eid=0; if(flags&0x04){eid=dv.getUint32(o,false);o+=4;}
    let sessId=null;
    if(o+4<=buf.byteLength){const sl=dv.getUint32(o,false);if(sl>0&&sl<200&&o+4+sl<=buf.byteLength){o+=4;sessId=new TextDecoder().decode(new Uint8Array(buf,o,sl));o+=sl;}}
    let payload=null;
    if(o+4<=buf.byteLength){const pl=dv.getUint32(o,false);o+=4;if(pl>0&&o+pl<=buf.byteLength)payload=buf.slice(o,o+pl);}
    return {msgType,eid,payload};
  };

  // ── 音频播放队列 ──────────────────────────────────────
  const flushAudio = () => {
    if(!chunks.length)return;
    const tot=chunks.reduce((s,c)=>s+c.byteLength,0), merged=new Uint8Array(tot); let o=0;
    chunks.forEach(c=>{merged.set(new Uint8Array(c),o);o+=c.byteLength;}); chunks=[];
    queue.push(URL.createObjectURL(new Blob([merged],{type:'audio/ogg; codecs=opus'})));
    playNext();
  };
  const playNext = () => {
    if(playing||!queue.length)return; playing=true;
    const url=queue.shift(), a=new Audio(url);
    const done=()=>{URL.revokeObjectURL(url);playing=false;playNext();};
    a.onended=done; a.onerror=done; a.play().catch(done);
  };
  const stopAudio = () => { queue=[]; chunks=[]; playing=false; };

  // ── 麦克风 ───────────────────────────────────────────
  const _startMic = async () => {
    $('dw-tapbtn').style.display='none';
    setStatus('正在聆听…');
    setListening(true);
    try {
      micStream = await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      audioCtx  = new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
      srcNode   = audioCtx.createMediaStreamSource(micStream);
      processor = audioCtx.createScriptProcessor(512,1,1);
      processor.onaudioprocess = e => {
        if(!ws||ws.readyState!==WebSocket.OPEN)return;
        const f32=e.inputBuffer.getChannelData(0), i16=new Int16Array(f32.length);
        f32.forEach((v,i)=>{i16[i]=Math.max(-32768,Math.min(32767,v*32767));});
        ws.send(encodeAudio(i16.buffer));
      };
      srcNode.connect(processor); processor.connect(audioCtx.destination);
    } catch(e) { setStatus('麦克风错误: '+(e.name||e.message)); }
  };
  const stopMic = () => {
    try{processor?.disconnect();}catch(_){}
    try{srcNode?.disconnect();}catch(_){}
    try{audioCtx?.close();}catch(_){}
    micStream?.getTracks().forEach(t=>t.stop()); micStream=srcNode=processor=audioCtx=null;
  };

  // ── WS 消息处理 ──────────────────────────────────────
  const sanitize = s => s.replace(/[\r\n\t]/g,' ').replace(/\\/g,'、').replace(/["]/g,'').replace(/\s{2,}/g,' ').trim().substring(0,500);

  const onMsg = evt => {
    if(!(evt.data instanceof ArrayBuffer))return;
    const {msgType,eid,payload}=parseFrame(evt.data);
    if(msgType===9&&payload){
      let j={}; try{j=JSON.parse(new TextDecoder().decode(payload));}catch(_){}
      if(eid===50){  // ConnectionStarted
        setStatus('连接成功，初始化中…');
        ws.send(encode(100, JSON.stringify({
          tts:{speaker:SPEAKER,audio_config:{channel:1,format:'ogg_opus',sample_rate:24000},extra:{}},
          asr:{audio_info:{format:'pcm',sample_rate:16000,channel:1}},
          dialog:{bot_name:'助理',system_role:sanitize(SYSTEM_PROMPT),speaking_style:'口语化、简短，每次不超过3句话',extra:{model:'1.2.1.1',input_mod:'keep_alive',strict_audit:false}}
        }), sid));
      } else if(eid===150){ // SessionStarted
        state='listening'; setStatus('点击下方开始说话');
        $('dw-tapbtn').style.display='flex';
      } else if(eid===350){ // TTSSentenceStart
        const t=j.text||''; if(t)setSub(t);
        state='speaking'; setStatus('助理正在说话…');
        setListening(false); setWave(true,false);
      } else if(eid===351){ flushAudio();
      } else if(eid===359){ flushAudio(); state='listening'; setStatus('正在聆听…'); setListening(true);
      } else if(eid===450){ stopAudio();
      } else if(eid===451){ const t=(j.results||[]).map(r=>r.text).join(''); if(t){setStatus('我听到：'+t);setSub(t);}
      } else if(eid===153||eid===599){ setStatus('连接出错，请重试'); }
    }
    if(msgType===11&&payload) chunks.push(payload);
  };

  // ── 公开方法 ─────────────────────────────────────────
  const open = () => {
    const m=$('dw-modal'); m.style.display='flex';
    setSub(''); setStatus('正在连接…'); setDot(false); setWave(false,false);
    $('dw-tapbtn').style.display='none';
    sid=uuid(); seq=2; chunks=[];

    const u=new URL(WS_URL);
    u.searchParams.set('session_id','dw_'+Date.now());
    ws=new WebSocket(u.toString()); ws.binaryType='arraybuffer';
    ws.onopen    = () => { ws.send(encode(1,'{}',null)); };
    ws.onmessage = onMsg;
    ws.onerror   = () => setStatus('连接失败，请检查网络');
    ws.onclose   = e  => { stopMic(); setStatus('已断开 ('+e.code+')'); state='idle'; setWave(false,false); setDot(false); };
  };

  const close = () => {
    $('dw-modal').style.display='none';
    if(ws&&ws.readyState===WebSocket.OPEN){
      try{ ws.send(encode(102,'{}',sid)); setTimeout(()=>{ try{ws.send(encode(2,'{}',null)); setTimeout(()=>ws?.close(),300);}catch(_){}},300); }catch(_){}
    }
    stopMic(); stopAudio(); ws=null; state='idle'; setWave(false,false); setDot(false);
  };

  // 补一个 dotpulse 动画
  const style=document.createElement('style');
  style.textContent='@keyframes dw-dotpulse{0%,100%{opacity:.5;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}';
  document.head.appendChild(style);

  return { open, close, _startMic, _ws: ()=>ws, _sid: ()=>sid, _encode: encode };
})();
</script>
<!-- ══ 豆包语音助理组件 结束 ══ -->

    <div style="overflow-y:auto;max-height:62vh;padding:0 16px 20px;display:flex;flex-direction:column;gap:18px;">

      <!-- ① 音色切换 ─────────────────────────── -->
      <div>
        <div style="font-size:9px;font-weight:700;color:#818cf8;letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;">
          <span>① 音色切换</span>
          <div style="flex:1;height:1px;background:rgba(99,102,241,.2);"></div>
          <span style="font-size:9px;color:#475569;font-weight:400;">立即生效</span>
        </div>
        <!-- 音色卡片网格 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;" id="ctrl-speaker-grid">
          <!-- 由JS渲染 -->
        </div>
        <div id="ctrl-speaker-hint" style="margin-top:8px;font-size:10px;color:#475569;font-family:monospace;padding:6px 10px;background:rgba(255,255,255,.03);border-radius:8px;border:1px solid rgba(255,255,255,.06);min-height:28px;"></div>

          <span>② 语速 · 音量</span>
          <div style="flex:1;height:1px;background:rgba(99,102,241,.2);"></div>
          <span style="font-size:9px;color:#f59e0b;font-weight:400;">重启后生效</span>
        </div>

        <!-- 语速 -->
        <div style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
            <span style="font-size:12px;color:#94a3b8;">语速</span>
            <span id="ctrl-rate-val" style="font-size:13px;font-weight:700;color:#a5b4fc;font-family:monospace;min-width:32px;text-align:right;">0</span>
          </div>
          <div style="position:relative;height:28px;display:flex;align-items:center;">
            <div style="position:absolute;left:0;right:0;height:4px;border-radius:2px;background:rgba(255,255,255,.08);"></div>
            <div id="ctrl-rate-fill" style="position:absolute;left:50%;height:4px;border-radius:2px;background:linear-gradient(90deg,#6366f1,#a5b4fc);width:0;transition:width .15s,left .15s;"></div>
            <input type="range" id="ctrl-rate" min="-50" max="100" value="0" step="5"
              oninput="CTRL.onRate(this.value)"
              style="position:relative;z-index:1;width:100%;height:28px;opacity:0;cursor:pointer;margin:0;">
          </div>
          <div style="display:flex;justify-content:space-between;font-size:9px;color:#334155;font-family:monospace;margin-top:2px;">
            <span>-50 慢</span><span>0</span><span>快 100</span>
          </div>
        </div>

        <!-- 音量 -->
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
            <span style="font-size:12px;color:#94a3b8;">音量</span>
            <span id="ctrl-vol-val" style="font-size:13px;font-weight:700;color:#a5b4fc;font-family:monospace;min-width:32px;text-align:right;">0</span>
          </div>
          <div style="position:relative;height:28px;display:flex;align-items:center;">
            <div style="position:absolute;left:0;right:0;height:4px;border-radius:2px;background:rgba(255,255,255,.08);"></div>
            <div id="ctrl-vol-fill" style="position:absolute;left:50%;height:4px;border-radius:2px;background:linear-gradient(90deg,#6366f1,#a5b4fc);width:0;transition:width .15s,left .15s;"></div>
            <input type="range" id="ctrl-vol" min="-50" max="100" value="0" step="5"
              oninput="CTRL.onVol(this.value)"
              style="position:relative;z-index:1;width:100%;height:28px;opacity:0;cursor:pointer;margin:0;">
          </div>
          <div style="display:flex;justify-content:space-between;font-size:9px;color:#334155;font-family:monospace;margin-top:2px;">
            <span>-50 小</span><span>0</span><span>大 100</span>
          </div>
        </div>

        <!-- 方言 -->
        <div style="margin-top:16px;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:9px;">
            <span style="font-size:12px;color:#94a3b8;">方言</span>
            <span style="font-size:10px;color:#475569;">仅 vv 音色 + 2.0 模型生效</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;" id="ctrl-dialect-grid"></div>
        </div>

        <!-- 重启session按钮 -->
        <button id="ctrl-restart-btn" onclick="CTRL.restartSession()" style="
          margin-top:16px;width:100%;padding:13px;border-radius:14px;border:none;
          background:linear-gradient(135deg,#6366f1,#818cf8);
          color:#fff;font-size:13px;font-weight:700;cursor:pointer;
          letter-spacing:.05em;font-family:monospace;
          box-shadow:0 4px 16px rgba(99,102,241,.4);
          transition:opacity .2s;
        ">↺ 重启 Session 应用设置</button>
        <div style="text-align:center;font-size:10px;color:#334155;margin-top:6px;">语速、音量、方言在下次 Session 初始化时生效</div>
      </div>

    </div>
  </div>
</div>

<style>
/* 自定义滑块轨道透明（原生range隐藏，用div模拟轨道） */
#ctrl-rate::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:#818cf8; box-shadow:0 2px 8px rgba(99,102,241,.6); cursor:pointer; }
#ctrl-vol::-webkit-slider-thumb  { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:#818cf8; box-shadow:0 2px 8px rgba(99,102,241,.6); cursor:pointer; }
#ctrl-rate::-webkit-slider-runnable-track { background:transparent; }
#ctrl-vol::-webkit-slider-runnable-track  { background:transparent; }
@keyframes ctrl-drawerout { from{transform:translateY(100%)} to{transform:translateY(0)} }
</style>

<script>
const CTRL = (() => {
  // ── 音色列表 ──────────────────────────────────────────
  const SPEAKERS = [
    { id:'zh_female_vv_jupiter_bigtts',     label:'vv',     desc:'活泼女声', emoji:'👧' },
    { id:'zh_female_xiaohe_jupiter_bigtts', label:'晓禾',   desc:'台湾女声', emoji:'🌸' },
    { id:'zh_male_yunzhou_jupiter_bigtts',  label:'云舟',   desc:'沉稳男声', emoji:'🧔' },
    { id:'zh_male_xiaotian_jupiter_bigtts', label:'小天',   desc:'磁性男声', emoji:'🎙' },
  ];

  const DIALECTS = [
    { id:'none',    label:'标准', emoji:'🗣' },
    { id:'dongbei', label:'东北', emoji:'🌨' },
    { id:'sichuan', label:'四川', emoji:'🌶' },
    { id:'shaanxi', label:'陕西', emoji:'🏯' },
  ];

  // ── 状态 ─────────────────────────────────────────────
  let currentSpeaker = SPEAKERS[0].id;
  let pendingRate = 0, pendingVol = 0, pendingDialect = 'none';
  let toastTimer = null;

  // ── DOM helpers ──────────────────────────────────────
  const $ = id => document.getElementById(id);

  const toast = msg => {
    const el = $('ctrl-toastlabel');
    el.textContent = msg; el.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 2000);
  };

  const refreshConn = () => {
    const ws = DW._ws();
    const alive = ws && ws.readyState === WebSocket.OPEN;
    $('ctrl-dot').style.background = alive ? '#4ade80' : '#334155';
    $('ctrl-connlabel').textContent = alive ? '已连接，操作立即可用' : 'Session 未就绪';
  };

  // ── encode 副本（与插件完全一致）────────────────────
  const encode = (eid, payload, sessionId) => {
    const hdr = new Uint8Array([0x11,0x14,0x10,0x00]), parts = [];
    const eb = new ArrayBuffer(4); new DataView(eb).setUint32(0,eid,false); parts.push(new Uint8Array(eb));
    if (sessionId) {
      const sb = new TextEncoder().encode(sessionId);
      const sl = new ArrayBuffer(4); new DataView(sl).setUint32(0,sb.byteLength,false);
      parts.push(new Uint8Array(sl)); parts.push(sb);
    }
    const pb = typeof payload==='string' ? new TextEncoder().encode(payload) : new Uint8Array(payload);
    const pl = new ArrayBuffer(4); new DataView(pl).setUint32(0,pb.byteLength,false);
    parts.push(new Uint8Array(pl)); parts.push(pb);
    const tot = parts.reduce((s,p)=>s+p.byteLength, hdr.byteLength);
    const out = new Uint8Array(tot); let o=0;
    out.set(hdr,o); o+=hdr.byteLength;
    parts.forEach(p=>{ out.set(p,o); o+=p.byteLength; });
    return out.buffer;
  };

  // ── 渲染音色卡片 ─────────────────────────────────────
  const renderSpeakers = () => {
    const grid = $('ctrl-speaker-grid');
    grid.innerHTML = SPEAKERS.map(s => `
      <button onclick="CTRL.selectSpeaker('${s.id}')" id="ctrl-sp-${s.id.replace(/[^a-z]/gi,'_')}" style="
        padding:12px 10px;border-radius:14px;border:1.5px solid ${s.id===currentSpeaker?'rgba(99,102,241,.8)':'rgba(255,255,255,.07)'};
        background:${s.id===currentSpeaker?'rgba(99,102,241,.15)':'rgba(255,255,255,.03)'};
        cursor:pointer;text-align:left;transition:all .2s;
        display:flex;align-items:center;gap:10px;
      ">
        <span style="font-size:22px;line-height:1;">${s.emoji}</span>
        <div>
          <div style="font-size:13px;font-weight:700;color:${s.id===currentSpeaker?'#a5b4fc':'#94a3b8'};line-height:1.3;">${s.label}</div>
          <div style="font-size:10px;color:#475569;">${s.desc}</div>
        </div>
        ${s.id===currentSpeaker?'<span style="margin-left:auto;width:7px;height:7px;border-radius:50%;background:#818cf8;flex-shrink:0;"></span>':''}
      </button>
    `).join('');
  };

  // ── 渲染方言卡片 ─────────────────────────────────────
  const renderDialects = () => {
    const grid = document.getElementById('ctrl-dialect-grid');
    if (!grid) return;
    grid.innerHTML = DIALECTS.map(d => `
      <button onclick="CTRL.selectDialect('${d.id}')" style="
        padding:10px 6px;border-radius:12px;
        border:1.5px solid ${d.id===pendingDialect?'rgba(99,102,241,.8)':'rgba(255,255,255,.07)'};
        background:${d.id===pendingDialect?'rgba(99,102,241,.15)':'rgba(255,255,255,.03)'};
        cursor:pointer;text-align:center;transition:all .2s;
      ">
        <div style="font-size:18px;line-height:1.4;">${d.emoji}</div>
        <div style="font-size:11px;font-weight:700;color:${d.id===pendingDialect?'#a5b4fc':'#64748b'};margin-top:2px;">${d.label}</div>
      </button>
    `).join('');
  };

  // ── 功能③ 方言切换（session级别，重启后生效）────────
  const selectDialect = id => {
    pendingDialect = id;
    renderDialects();
    const d = DIALECTS.find(x=>x.id===id);
    toast(d.id==='none' ? '标准普通话（重启生效）' : `${d.label}方言（重启生效）`);
  };

  // ── 功能① 音色切换 UpdateConfig eid=201 ─────────────
  const selectSpeaker = id => {
    const ws = DW._ws(), sid = DW._sid();
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      toast('⚠ 未连接'); return;
    }
    currentSpeaker = id;
    renderSpeakers();
    const sp = SPEAKERS.find(s=>s.id===id);
    $('ctrl-speaker-hint').textContent = `发送 UpdateConfig → ${sp.label} (${sp.desc})`;
    ws.send(encode(201, JSON.stringify({ tts:{ speaker: id } }), sid));
    setTimeout(()=>{ $('ctrl-speaker-hint').textContent = `✓ 已切换到 ${sp.label}，下一句生效`; }, 200);
    toast(`✓ ${sp.label}`);
  };

  // ── 功能② 滑块回调 ──────────────────────────────────
  const onRate = val => {
    pendingRate = parseInt(val);
    $('ctrl-rate-val').textContent = pendingRate;
    updateFill('ctrl-rate-fill', pendingRate, -50, 100);
  };

  const onVol = val => {
    pendingVol = parseInt(val);
    $('ctrl-vol-val').textContent = pendingVol;
    updateFill('ctrl-vol-fill', pendingVol, -50, 100);
  };

  const updateFill = (fillId, val, min, max) => {
    const fill = $(fillId);
    const pct = (val - min) / (max - min) * 100; // 0~100%
    const center = (0 - min) / (max - min) * 100; // 0值位置%
    if (val >= 0) {
      fill.style.left = center + '%';
      fill.style.width = (pct - center) + '%';
    } else {
      fill.style.left = pct + '%';
      fill.style.width = (center - pct) + '%';
    }
  };

  // ── 功能② 重启Session ────────────────────────────────
  // 通过 window._doubaoSpeaker / _doubaoSpeechRate / _doubaoLoudnessRate
  // 插件 open() 时读 window._doubaoSpeaker，但语速/音量在 StartSession payload 里
  // 需要猴补：在 DW.open 之前把参数写入 window，然后重开
  const restartSession = () => {
    const btn = $('ctrl-restart-btn');
    btn.textContent = '重启中…'; btn.style.opacity = '.5'; btn.disabled = true;

    // 把 pending 参数挂到 window，供下面的 patchedOpen 读取
    window._ctrlPendingRate     = pendingRate;
    window._ctrlPendingVol      = pendingVol;
    window._ctrlPendingSpeaker  = currentSpeaker;
    window._ctrlPendingDialect  = pendingDialect;
    window._doubaoSpeaker       = currentSpeaker; // 插件 open() 读这个

    DW.close();

    // 等关闭动画后重开；用 monkeypatch 拦截 StartSession 注入 speech_rate/loudness_rate
    setTimeout(() => {
      // 临时覆盖 DW._encode 不行（是副本），改用 WebSocket.prototype.send 拦截一次
      const origSend = WebSocket.prototype.send;
      let intercepted = false;
      WebSocket.prototype.send = function(data) {
        if (!intercepted && data instanceof ArrayBuffer && data.byteLength > 20) {
          const dv = new DataView(data);
          // 判断是否是 StartSession (eid=100)
          let o = 4; // skip header
          // flags = byte1 & 0x0f，检查有 event field
          const flags = dv.getUint8(1) & 0x0f;
          if (flags & 0x04) {
            const maybeEid = dv.getUint32(o, false); o += 4;
            if (maybeEid === 100) {
              intercepted = true;
              WebSocket.prototype.send = origSend; // 恢复
              // 解析 payload
              try {
                // skip session id
                const sl = dv.getUint32(o, false); o += 4 + sl;
                const pl = dv.getUint32(o, false); o += 4;
                const jsonStr = new TextDecoder().decode(new Uint8Array(data, o, pl));
                const obj = JSON.parse(jsonStr);
                // 注入 speech_rate 和 loudness_rate
                obj.tts = obj.tts || {};
                obj.tts.audio_config = obj.tts.audio_config || {};
                obj.tts.audio_config.speech_rate   = window._ctrlPendingRate;
                obj.tts.audio_config.loudness_rate = window._ctrlPendingVol;
                obj.tts.speaker = window._ctrlPendingSpeaker;
                // 方言：none 时不传，避免影响非 vv 音色
                obj.tts.extra = obj.tts.extra || {};
                if (window._ctrlPendingDialect && window._ctrlPendingDialect !== 'none') {
                  obj.tts.extra.explicit_dialect = window._ctrlPendingDialect;
                } else {
                  delete obj.tts.extra.explicit_dialect;
                }
                // 重新 encode
                const newData = encode(100, JSON.stringify(obj), DW._sid());
                origSend.call(this, newData);
                const dialectLabel = DIALECTS.find(d=>d.id===window._ctrlPendingDialect)?.label || '标准';
                toast(`✓ 语速${pendingRate} 音量${pendingVol} 方言:${dialectLabel}`);
                return;
              } catch(e) {
                console.warn('CTRL intercept failed', e);
              }
            }
          }
        }
        origSend.call(this, data);
      };

      DW.open();
      setTimeout(()=>{
        btn.textContent = '↺ 重启 Session 应用设置';
        btn.style.opacity = '1'; btn.disabled = false;
        WebSocket.prototype.send = origSend; // 超时保底恢复
      }, 5000);
    }, 600);
  };

  // ── 抽屉开关 ─────────────────────────────────────────
  const toggle = () => {
    const ol = $('ctrl-overlay');
    ol.style.display === 'flex' ? close() : open();
  };
  const open = () => {
    refreshConn();
    renderSpeakers();
    renderDialects();
    const ol = $('ctrl-overlay'), dr = $('ctrl-drawer');
    ol.style.display = 'flex';
    requestAnimationFrame(()=>{ dr.style.transform = 'translateY(0)'; });
  };
  const close = () => {
    const dr = $('ctrl-drawer');
    dr.style.transform = 'translateY(100%)';
    setTimeout(()=>{ $('ctrl-overlay').style.display='none'; }, 300);
  };

  // ── 初始化 ───────────────────────────────────────────
  renderSpeakers();
  renderDialects();
  updateFill('ctrl-rate-fill', 0, -50, 100);
  updateFill('ctrl-vol-fill',  0, -50, 100);

  return { toggle, open, close, selectSpeaker, selectDialect, onRate, onVol, restartSession };
})();
</script>
<!-- ══ 豆包控制面板 外挂层 结束 ══ -->

</body>
</html>
